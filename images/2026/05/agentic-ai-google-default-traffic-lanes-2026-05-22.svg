<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#F6F5F0"/>
  <defs>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0%" stop-color="#5B8CFF"/>
      <stop offset="100%" stop-color="#7B61FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>
  <text x="800" y="78" text-anchor="middle" font-size="40" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">Agentic AI Is Entering Google’s Default Traffic Lanes</text>
  <text x="800" y="118" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#666666">The real shift is not a better model alone, but AI behavior moving into Search, Maps, YouTube, Gemini, and Cloud at default scale.</text>
  <rect x="210" y="210" width="1180" height="470" rx="30" fill="#FFFFFF" filter="url(#shadow)"/>
  <circle cx="800" cy="445" r="118" fill="#111111"/>
  <text x="800" y="432" text-anchor="middle" font-size="28" font-family="Arial, Helvetica, sans-serif" fill="#F6F5F0" font-weight="700">Agentic</text>
  <text x="800" y="468" text-anchor="middle" font-size="28" font-family="Arial, Helvetica, sans-serif" fill="#F6F5F0" font-weight="700">Behavior</text>
  <circle cx="430" cy="305" r="84" fill="#EEF3FF" stroke="#DDE4F5" stroke-width="2"/>
  <text x="430" y="297" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#326BFF" font-weight="700">Search</text>
  <text x="430" y="330" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">AI Overviews</text>
  <circle cx="1170" cy="305" r="84" fill="#F3EEFF" stroke="#E3DBFF" stroke-width="2"/>
  <text x="1170" y="297" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#7B61FF" font-weight="700">Gemini</text>
  <text x="1170" y="330" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">App / AI Mode</text>
  <circle cx="430" cy="585" r="84" fill="#FFF3E9" stroke="#F0E0CF" stroke-width="2"/>
  <text x="430" y="577" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#C67A2D" font-weight="700">Maps</text>
  <text x="430" y="610" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">default action</text>
  <circle cx="1170" cy="585" r="84" fill="#F1F8EE" stroke="#D8E7D2" stroke-width="2"/>
  <text x="1170" y="577" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#3B8C4E" font-weight="700">YouTube</text>
  <text x="1170" y="610" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">Cloud / surfaces</text>
  <line x1="500" y1="335" x2="695" y2="405" stroke="url(#glow)" stroke-width="6" stroke-linecap="round"/>
  <line x1="1100" y1="335" x2="905" y2="405" stroke="url(#glow)" stroke-width="6" stroke-linecap="round"/>
  <line x1="500" y1="555" x2="695" y2="485" stroke="url(#glow)" stroke-width="6" stroke-linecap="round"/>
  <line x1="1100" y1="555" x2="905" y2="485" stroke="url(#glow)" stroke-width="6" stroke-linecap="round"/>
  <rect x="180" y="760" width="1240" height="58" rx="16" fill="#111111"/>
  <text x="800" y="797" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#F6F5F0">The new contest is not only over who builds agents, but who embeds agent behavior into the consumer internet’s default traffic system.</text>
</svg>