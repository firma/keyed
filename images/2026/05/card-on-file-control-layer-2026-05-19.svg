  <text x="580" y="435" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">PSP / acquirer / NT</text>
  <text x="580" y="468" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">approval uplift</text>
