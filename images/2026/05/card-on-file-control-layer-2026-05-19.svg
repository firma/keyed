<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#F7F7F3"/>
  <text x="800" y="86" text-anchor="middle" font-size="38" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">Card-on-File Is Becoming the New PSP Control Layer</text>
  <text x="800" y="126" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#666666">The real checkout battle is shifting from page layout alone to stored-credential design, token lifecycle management, and long-term payment relationship control.</text>
  <rect x="145" y="220" width="1310" height="380" rx="24" fill="#FFFFFF" stroke="#D9D9D1"/>
