  <rect x="140" y="770" width="1320" height="56" rx="12" fill="#111111"/>
  <text x="800" y="806" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#F7F7F3">Card-on-File is no longer a convenience feature. It is the operating layer for long-term payment relationship design.</text>
