  <text x="450" y="357" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#2C3446">2.5B AI Overviews MAU</text>
  <rect x="680" y="275" width="240" height="118" rx="24" fill="#F5EFFF"/>
  <text x="800" y="323" text-anchor="middle" font-size="27" font-family="Arial, Helvetica, sans-serif" fill="#6E47E5" font-weight="700">AI Mode</text>
