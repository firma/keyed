  <rect x="170" y="785" width="1260" height="52" rx="15" fill="#111827"/>
  <text x="800" y="819" text-anchor="middle" font-size="23" font-family="Arial, Helvetica, sans-serif" fill="#FFFFFF">The strategic shift is not a better AI app alone, but a platform-wide effort to route default user behavior through an agentic layer.</text>
