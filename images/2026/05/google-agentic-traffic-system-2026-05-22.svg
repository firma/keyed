  <rect width="1600" height="900" fill="url(#bg2)"/>
  <text x="800" y="88" text-anchor="middle" font-size="42" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">Google’s Agentic Traffic System</text>
  <text x="800" y="130" text-anchor="middle" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#5F6475">This is what it looks like when agent behavior moves into the products people already use by default.</text>
