  <text x="1150" y="323" text-anchor="middle" font-size="27" font-family="Arial, Helvetica, sans-serif" fill="#C56C17" font-weight="700">Gemini App</text>
  <text x="1150" y="357" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#2C3446">900M monthly active users</text>
