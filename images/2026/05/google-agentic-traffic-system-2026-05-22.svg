  <text x="495" y="698" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#2C3446">everyday consumer lanes</text>
  <rect x="980" y="620" width="250" height="108" rx="24" fill="#F3F7FF"/>
  <text x="1105" y="665" text-anchor="middle" font-size="26" font-family="Arial, Helvetica, sans-serif" fill="#3569D4" font-weight="700">Cloud / APIs</text>
