  <text x="800" y="505" text-anchor="middle" font-size="30" font-family="Arial, Helvetica, sans-serif" fill="#FFFFFF" font-weight="700">Default</text>
  <text x="800" y="544" text-anchor="middle" font-size="30" font-family="Arial, Helvetica, sans-serif" fill="#FFFFFF" font-weight="700">Behavior Layer</text>
  <path d="M450 392 L 715 478" stroke="url(#beam)" stroke-width="6" stroke-linecap="round"/>
  <path d="M800 393 L 800 410" stroke="url(#beam)" stroke-width="6" stroke-linecap="round"/>
  <path d="M1150 392 L 885 478" stroke="url(#beam)" stroke-width="6" stroke-linecap="round"/>
  <rect x="370" y="620" width="250" height="108" rx="24" fill="#EEFAF5"/>
