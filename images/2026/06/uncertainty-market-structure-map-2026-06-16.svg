<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8EF"/>
      <stop offset="100%" stop-color="#EEF5FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#101828" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <text x="800" y="88" text-anchor="middle" font-size="42" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">The Business of Uncertainty</text>
  <text x="800" y="130" text-anchor="middle" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#606777">Different products, same core move: discretize the future, standardize the event, price the disagreement, and monetize the structure.</text>
  <rect x="240" y="220" width="1120" height="480" rx="34" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="310" y="290" width="270" height="108" rx="24" fill="#EAF8FF"/>
  <text x="445" y="333" text-anchor="middle" font-size="28" font-family="Arial, Helvetica, sans-serif" fill="#1773D0" font-weight="700">Discretize</text>
  <text x="445" y="366" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#2D3547">Will it happen or not?</text>
  <rect x="665" y="290" width="270" height="108" rx="24" fill="#F4EEFF"/>
  <text x="800" y="333" text-anchor="middle" font-size="28" font-family="Arial, Helvetica, sans-serif" fill="#6E47E5" font-weight="700">Standardize</text>
  <text x="800" y="366" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#2D3547">Rules, terms, settlement source</text>
  <rect x="1020" y="290" width="270" height="108" rx="24" fill="#FFF3E6"/>
  <text x="1155" y="333" text-anchor="middle" font-size="28" font-family="Arial, Helvetica, sans-serif" fill="#C26A14" font-weight="700">Monetize</text>
  <text x="1155" y="366" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#2D3547">Rake, spread, fees, liquidity</text>
  <circle cx="800" cy="525" r="108" fill="#111827"/>
  <text x="800" y="510" text-anchor="middle" font-size="30" font-family="Arial, Helvetica, sans-serif" fill="#FFFFFF" font-weight="700">Probability</text>
  <text x="800" y="548" text-anchor="middle" font-size="30" font-family="Arial, Helvetica, sans-serif" fill="#FFFFFF" font-weight="700">As Market Product</text>
  <path d="M580 344 L665 344" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
  <path d="M935 344 L1020 344" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
  <path d="M800 398 L800 417" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
  <rect x="340" y="610" width="260" height="94" rx="24" fill="#ECFBF4"/>
  <text x="470" y="652" text-anchor="middle" font-size="26" font-family="Arial, Helvetica, sans-serif" fill="#17845A" font-weight="700">Lottery</text>
  <text x="470" y="685" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#2D3547">fantasy + high rake</text>
  <rect x="670" y="610" width="260" height="94" rx="24" fill="#FFF5ED"/>
  <text x="800" y="652" text-anchor="middle" font-size="26" font-family="Arial, Helvetica, sans-serif" fill="#B6631A" font-weight="700">Weather</text>
  <text x="800" y="685" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#2D3547">definition + settlement</text>
  <rect x="1000" y="610" width="260" height="94" rx="24" fill="#F3F0FF"/>
  <text x="1130" y="652" text-anchor="middle" font-size="26" font-family="Arial, Helvetica, sans-serif" fill="#6E47E5" font-weight="700">Binary Platform</text>
  <text x="1130" y="685" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#2D3547">market design + flow</text>
  <text x="800" y="812" text-anchor="middle" font-size="23" font-family="Arial, Helvetica, sans-serif" fill="#111111">The real money often belongs to whoever organizes the game, not whoever takes the bet.</text>
</svg>