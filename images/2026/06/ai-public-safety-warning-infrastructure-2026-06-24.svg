<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091220"/>
      <stop offset="100%" stop-color="#1E2846"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#45D1FF"/>
      <stop offset="100%" stop-color="#63F0B8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="86" text-anchor="middle" font-size="42" font-family="Arial, Helvetica, sans-serif" fill="#F8FAFF" font-weight="700">AI Is Leaving the Chat Surface</text>
  <text x="800" y="128" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#B9C6E9">and entering public-safety warning infrastructure</text>
  <circle cx="800" cy="450" r="122" fill="#F8FAFF"/>
  <circle cx="800" cy="450" r="100" fill="#111827"/>
  <text x="800" y="438" text-anchor="middle" font-size="29" font-family="Arial, Helvetica, sans-serif" fill="#FFFFFF" font-weight="700">Early</text>
  <text x="800" y="476" text-anchor="middle" font-size="29" font-family="Arial, Helvetica, sans-serif" fill="#FFFFFF" font-weight="700">Warning</text>
  <path d="M210 690 C 390 585, 520 525, 690 458" stroke="url(#beam)" stroke-width="18" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M1390 690 C 1210 585, 1080 525, 910 458" stroke="url(#beam)" stroke-width="18" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M320 215 C 470 300, 585 360, 710 420" stroke="url(#beam)" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M1280 215 C 1130 300, 1015 360, 890 420" stroke="url(#beam)" stroke-width="14" fill="none" stroke-linecap="round"/>
  <g>
    <circle cx="220" cy="715" r="74" fill="#111827" stroke="#45D1FF" stroke-width="3"/>
    <text x="220" y="705" text-anchor="middle" font-size="23" font-family="Arial, Helvetica, sans-serif" fill="#EAFBFF" font-weight="700">2B</text>
    <text x="220" y="736" text-anchor="middle" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#A2DDF0">people covered</text>
  </g>
  <g>
    <circle cx="1380" cy="715" r="74" fill="#111827" stroke="#63F0B8" stroke-width="3"/>
    <text x="1380" y="705" text-anchor="middle" font-size="23" font-family="Arial, Helvetica, sans-serif" fill="#EDFFF8" font-weight="700">150+</text>
    <text x="1380" y="736" text-anchor="middle" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#B8F7DE">countries</text>
  </g>
  <g>
    <circle cx="320" cy="205" r="64" fill="#111827" stroke="#F59E0B" stroke-width="3"/>
    <text x="320" y="197" text-anchor="middle" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#FFF6E8" font-weight="700">7 days</text>
    <text x="320" y="226" text-anchor="middle" font-size="14" font-family="Arial, Helvetica, sans-serif" fill="#FFD38A">river flood lead time</text>
  </g>
  <g>
    <circle cx="1280" cy="205" r="64" fill="#111827" stroke="#F87171" stroke-width="3"/>
    <text x="1280" y="197" text-anchor="middle" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#FFF0F0" font-weight="700">24h</text>
    <text x="1280" y="226" text-anchor="middle" font-size="14" font-family="Arial, Helvetica, sans-serif" fill="#FFC1C1">urban flash flood notice</text>
  </g>
  <rect x="590" y="700" width="420" height="84" rx="22" fill="#FFFFFF" opacity="0.96"/>
  <text x="800" y="735" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#111827" font-weight="700">Open data • Hydrology framework</text>
  <text x="800" y="764" text-anchor="middle" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#111827">AI as civic infrastructure, not just interface</text>
  <text x="800" y="838" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#F8FAFF">The next important AI deployments may win not by sounding smarter, but by seeing danger earlier.</text>
</svg>