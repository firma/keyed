<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#0d1f35"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142b4d"/>
      <stop offset="100%" stop-color="#18385e"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#113b36"/>
      <stop offset="100%" stop-color="#18584f"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a214f"/>
      <stop offset="100%" stop-color="#5a2c76"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .title { font: 700 52px 'Inter', 'Segoe UI', sans-serif; fill: #f6fbff; }
      .subtitle { font: 400 24px 'Inter', 'Segoe UI', sans-serif; fill: #9fb6cb; }
      .cardTitle { font: 700 30px 'Inter', 'Segoe UI', sans-serif; fill: #ffffff; }
      .cardText { font: 400 21px 'Inter', 'Segoe UI', sans-serif; fill: #d7e6f5; }
      .small { font: 600 18px 'Inter', 'Segoe UI', sans-serif; fill: #8fb4ff; letter-spacing: 1px; }
      .foot { font: 400 18px 'Inter', 'Segoe UI', sans-serif; fill: #9fb6cb; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="120" y="120" class="title">AI Agent Payment Protocol Stack</text>
  <text x="120" y="162" class="subtitle">智能体支付开始分成两条主线：面向商业授权的 AP2，与面向机器资源结算的 x402</text>

  <rect x="120" y="230" rx="28" ry="28" width="400" height="470" fill="url(#card1)" filter="url(#shadow)"/>
  <text x="160" y="292" class="small">AGENTIC COMMERCE</text>
  <text x="160" y="340" class="cardTitle">AP2</text>
  <text x="160" y="390" class="cardText">• Intent / Cart / Payment Mandate</text>
  <text x="160" y="430" class="cardText">• Verifiable Credentials</text>
  <text x="160" y="470" class="cardText">• Authorization &amp; Accountability</text>
  <text x="160" y="510" class="cardText">• Human-present / delegated purchase</text>
  <text x="160" y="550" class="cardText">• A2A / MCP payment extension</text>
  <text x="160" y="620" class="cardText">更像“代理商业支付协议层”</text>

  <rect x="600" y="230" rx="28" ry="28" width="400" height="470" fill="url(#card2)" filter="url(#shadow)"/>
  <text x="640" y="292" class="small">MACHINE PAYMENTS</text>
  <text x="640" y="340" class="cardTitle">x402</text>
  <text x="640" y="390" class="cardText">• HTTP 402 Payment Required</text>
  <text x="640" y="430" class="cardText">• API / data / compute micropayments</text>
  <text x="640" y="470" class="cardText">• Stablecoin / on-chain settlement</text>
  <text x="640" y="510" class="cardText">• PaymentPayload / receipt lifecycle</text>
  <text x="640" y="550" class="cardText">• Native fit for software agents</text>
  <text x="640" y="620" class="cardText">更像“机器原生支付协议层”</text>

  <rect x="1080" y="230" rx="28" ry="28" width="400" height="470" fill="url(#card3)" filter="url(#shadow)"/>
  <text x="1120" y="292" class="small">EXECUTION LAYER</text>
  <text x="1120" y="340" class="cardTitle">A2A + MCP</text>
  <text x="1120" y="390" class="cardText">• A2A connects agent-to-agent tasks</text>
  <text x="1120" y="430" class="cardText">• MCP exposes payment tools to clients</text>
  <text x="1120" y="470" class="cardText">• Bridges workflows to payment rails</text>
  <text x="1120" y="510" class="cardText">• Practical integration surface today</text>
  <text x="1120" y="550" class="cardText">• Not the whole payment standard itself</text>
  <text x="1120" y="620" class="cardText">更像“执行接入层与通信层”</text>

  <path d="M520 465 C560 465, 560 465, 600 465" stroke="#5ea4ff" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M1000 465 C1040 465, 1040 465, 1080 465" stroke="#62d6b5" stroke-width="8" fill="none" stroke-linecap="round"/>

  <text x="120" y="790" class="foot">结论：AI Agent Payment 不是旧支付接口的 AI 包装，而是在形成新的授权、结算与协作协议栈。</text>
</svg>