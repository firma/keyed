<text x="620" y="450" fill="#e2e8f0" font-size="34" font-family="Arial, Helvetica, sans-serif">Model → Agent → Runtime → Governance</text>
<text x="620" y="515" fill="#cbd5e1" font-size="28" font-family="Arial, Helvetica, sans-serif">单点模型能力不再解释全部竞争力</text>
<text x="620" y="565" fill="#cbd5e1" font-size="28" font-family="Arial, Helvetica, sans-serif">未来护城河来自执行、权限、记忆、恢复、多代理</text>
<text x="130" y="730" fill="#93c5fd" font-size="26" font-family="Arial, Helvetica, sans-serif">Keyed AI · Daily Frontier Report</text>
