<text x="165" y="510" fill="#e2e8f0" font-size="30" font-family="Arial, Helvetica, sans-serif">1. Prompt 不是全部，Harness 才是产品壁垒</text>
<text x="165" y="560" fill="#e2e8f0" font-size="30" font-family="Arial, Helvetica, sans-serif">2. Memory / 权限 / Query Loop 才是可复制资产</text>
<text x="165" y="610" fill="#e2e8f0" font-size="30" font-family="Arial, Helvetica, sans-serif">3. 多代理与恢复机制决定系统上限</text>
<text x="165" y="660" fill="#e2e8f0" font-size="30" font-family="Arial, Helvetica, sans-serif">4. Agent 行业将从“模型竞争”转向“运行时竞争”</text>
