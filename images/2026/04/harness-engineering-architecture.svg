<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
<rect width="1400" height="1000" fill="#0f172a"/>
<text x="80" y="100" fill="#e2e8f0" font-size="48" font-family="Arial, Helvetica, sans-serif" font-weight="700">Harness Engineering 运行时骨架</text>
<rect x="80" y="160" width="1240" height="730" rx="28" fill="#111827" stroke="#334155"/>
<rect x="130" y="220" width="1140" height="110" rx="18" fill="#1d4ed8" opacity="0.9"/>
<text x="170" y="285" fill="#eff6ff" font-size="36" font-family="Arial, Helvetica, sans-serif" font-weight="700">控制平面 / Control Plane</text>
<text x="170" y="320" fill="#dbeafe" font-size="24" font-family="Arial, Helvetica, sans-serif">系统提示、预算、策略、权限规则、团队制度</text>
<rect x="130" y="390" width="260" height="180" rx="18" fill="#0b1220" stroke="#38bdf8"/>
<text x="160" y="450" fill="#7dd3fc" font-size="28" font-family="Arial, Helvetica, sans-serif">Query Loop</text>
<text x="160" y="495" fill="#e5e7eb" font-size="22" font-family="Arial, Helvetica, sans-serif">推理 → 工具 → 观察 → 重试</text>
<rect x="430" y="390" width="260" height="180" rx="18" fill="#0b1220" stroke="#38bdf8"/>
<text x="460" y="450" fill="#7dd3fc" font-size="28" font-family="Arial, Helvetica, sans-serif">Permissions</text>
<text x="460" y="495" fill="#e5e7eb" font-size="22" font-family="Arial, Helvetica, sans-serif">always allow / ask / deny</text>
<rect x="730" y="390" width="260" height="180" rx="18" fill="#0b1220" stroke="#38bdf8"/>
<text x="760" y="450" fill="#7dd3fc" font-size="28" font-family="Arial, Helvetica, sans-serif">Memory</text>
<text x="760" y="495" fill="#e5e7eb" font-size="22" font-family="Arial, Helvetica, sans-serif">索引、主题文件、压缩治理</text>
<rect x="1030" y="390" width="240" height="180" rx="18" fill="#0b1220" stroke="#38bdf8"/>
<text x="1060" y="450" fill="#7dd3fc" font-size="28" font-family="Arial, Helvetica, sans-serif">Recovery</text>
<text x="1060" y="495" fill="#e5e7eb" font-size="22" font-family="Arial, Helvetica, sans-serif">回滚、恢复、继续执行</text>
<rect x="280" y="650" width="840" height="150" rx="22" fill="#082f49" stroke="#22d3ee"/>
<text x="330" y="715" fill="#cffafe" font-size="34" font-family="Arial, Helvetica, sans-serif" font-weight="700">多代理 / 验证层</text>
<text x="330" y="760" fill="#ecfeff" font-size="24" font-family="Arial, Helvetica, sans-serif">Subagents · Worktree/Isolation · Verification · Coordination</text>
<line x1="260" y1="330" x2="260" y2="390" stroke="#94a3b8" stroke-width="4"/>
<line x1="560" y1="330" x2="560" y2="390" stroke="#94a3b8" stroke-width="4"/>
<line x1="860" y1="330" x2="860" y2="390" stroke="#94a3b8" stroke-width="4"/>
<line x1="1140" y1="330" x2="1140" y2="390" stroke="#94a3b8" stroke-width="4"/>
<line x1="700" y1="570" x2="700" y2="650" stroke="#94a3b8" stroke-width="4"/>
</svg>