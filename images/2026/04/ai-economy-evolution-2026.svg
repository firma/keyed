<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#F7F7F3"/>
  <text x="800" y="85" text-anchor="middle" font-size="42" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">The Evolution of AI Economy</text>
  <text x="800" y="125" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#666666">From Copilot to Agent Economy</text>
  <line x1="180" y1="430" x2="1420" y2="430" stroke="#CFCFC6" stroke-width="6"/>
  <circle cx="280" cy="430" r="18" fill="#3B82F6"/>
  <circle cx="600" cy="430" r="18" fill="#3B82F6"/>
  <circle cx="920" cy="430" r="18" fill="#B68B2D"/>
  <circle cx="1240" cy="430" r="18" fill="#B68B2D"/>
  <g transform="translate(170,220)">
    <text x="0" y="0" font-size="28" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">Stage 1</text>
    <text x="0" y="40" font-size="26" font-family="Arial, Helvetica, sans-serif" fill="#3B82F6" font-weight="700">Information AI</text>
    <text x="0" y="85" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">Search</text>
    <text x="0" y="118" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">Summarization</text>
    <text x="0" y="151" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">Q&amp;A</text>
    <text x="0" y="184" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">Content generation</text>
    <text x="0" y="250" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#666666">AI helps humans understand information faster.</text>
  </g>
  <g transform="translate(490,220)">
    <text x="0" y="0" font-size="28" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">Stage 2</text>
    <text x="0" y="40" font-size="26" font-family="Arial, Helvetica, sans-serif" fill="#3B82F6" font-weight="700">Productivity AI</text>
    <text x="0" y="85" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">Writing assistance</text>
    <text x="0" y="118" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">Coding assistance</text>
    <text x="0" y="151" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">Customer support</text>
    <text x="0" y="184" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">Knowledge work acceleration</text>
    <text x="0" y="250" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#666666">AI starts improving measurable work output.</text>
  </g>
  <g transform="translate(810,220)">
    <text x="0" y="0" font-size="28" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">Stage 3</text>
    <text x="0" y="40" font-size="26" font-family="Arial, Helvetica, sans-serif" fill="#B68B2D" font-weight="700">Workflow AI</text>
    <text x="0" y="85" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">Tool use</text>
    <text x="0" y="118" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">Multi-step execution</text>
    <text x="0" y="151" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">Cross-system orchestration</text>
    <text x="0" y="184" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">Embedded enterprise AI</text>
    <text x="0" y="250" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#666666">AI becomes part of business processes and software flows.</text>
  </g>
  <g transform="translate(1130,220)">
    <text x="0" y="0" font-size="28" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">Stage 4</text>
    <text x="0" y="40" font-size="26" font-family="Arial, Helvetica, sans-serif" fill="#B68B2D" font-weight="700">Agent Economy</text>
    <text x="0" y="85" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">Autonomous task completion</text>
    <text x="0" y="118" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">Agent-to-agent interaction</text>
    <text x="0" y="151" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">Machine payments</text>
    <text x="0" y="184" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">AI-native commerce and services</text>
    <text x="0" y="250" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#666666">AI becomes an authorized actor in the economy.</text>
  </g>
  <rect x="120" y="800" width="1360" height="58" rx="12" fill="#111111"/>
  <text x="800" y="837" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#F7F7F3">The real shift is not smarter answers. It is AI gaining the ability to act, transact, and coordinate.</text>
</svg>