<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#F7F7F3"/>
  <text x="800" y="88" text-anchor="middle" font-size="40" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">From Content Network to Action Network</text>
  <text x="800" y="128" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#666666">How AI is changing the structure of the internet</text>
  <line x1="140" y1="470" x2="1460" y2="470" stroke="#D9D9D1" stroke-width="6"/>
  <circle cx="220" cy="470" r="18" fill="#111111"/>
  <circle cx="500" cy="470" r="18" fill="#111111"/>
  <circle cx="780" cy="470" r="18" fill="#111111"/>
  <circle cx="1060" cy="470" r="18" fill="#3B82F6"/>
  <circle cx="1340" cy="470" r="18" fill="#B68B2D"/>
  <g transform="translate(120,220)">
    <text x="0" y="0" font-size="26" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">Stage 1</text>
    <text x="0" y="36" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">Content Web</text>
    <text x="0" y="82" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Websites</text>
    <text x="0" y="112" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Publishing</text>
    <text x="0" y="142" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Search</text>
    <text x="0" y="172" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Information access</text>
  </g>
  <g transform="translate(385,220)">
    <text x="0" y="0" font-size="26" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">Stage 2</text>
    <text x="0" y="36" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">Platform Web</text>
    <text x="0" y="82" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Social</text>
    <text x="0" y="112" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Marketplaces</text>
    <text x="0" y="142" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Mobile apps</text>
    <text x="0" y="172" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">• User distribution</text>
  </g>
  <g transform="translate(650,220)">
    <text x="0" y="0" font-size="26" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">Stage 3</text>
    <text x="0" y="36" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">Software Web</text>
    <text x="0" y="82" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">• SaaS</text>
    <text x="0" y="112" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Cloud</text>
    <text x="0" y="142" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">• APIs</text>
    <text x="0" y="172" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Online workflows</text>
  </g>
  <g transform="translate(915,220)">
    <text x="0" y="0" font-size="26" font-family="Arial, Helvetica, sans-serif" fill="#3B82F6" font-weight="700">Stage 4</text>
    <text x="0" y="36" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#3B82F6" font-weight="700">Action Web</text>
    <text x="0" y="82" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Agents</text>
    <text x="0" y="112" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Tool use</text>
    <text x="0" y="142" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Task execution</text>
    <text x="0" y="172" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Cross-system workflows</text>
  </g>
  <g transform="translate(1180,220)">
    <text x="0" y="0" font-size="26" font-family="Arial, Helvetica, sans-serif" fill="#B68B2D" font-weight="700">Stage 5</text>
    <text x="0" y="36" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#B68B2D" font-weight="700">Value Web</text>
    <text x="0" y="82" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Machine payments</text>
    <text x="0" y="112" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Wallet identity</text>
    <text x="0" y="142" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Programmable authorization</text>
    <text x="0" y="172" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Agent transactions</text>
  </g>
  <rect x="180" y="800" width="1240" height="56" rx="12" fill="#111111"/>
  <text x="800" y="836" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#F7F7F3">The Web is evolving from a network of information to a network of action and value.</text>
</svg>