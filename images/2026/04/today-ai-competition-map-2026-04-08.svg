  <g transform="translate(150,540)">
    <text x="0" y="0" font-size="30" font-family="Arial, Helvetica, sans-serif" fill="#B68B2D" font-weight="700">Enterprise</text>
    <text x="0" y="55" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Workflow integration</text>
    <text x="0" y="95" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Permissions</text>
    <text x="0" y="135" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Observability</text>
    <text x="0" y="175" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Reliability</text>
