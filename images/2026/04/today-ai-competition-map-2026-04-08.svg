  <rect x="120" y="790" width="1360" height="58" rx="12" fill="#111111"/>
  <text x="800" y="827" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#F7F7F3">The center of gravity is shifting from model quality to system capability.</text>
