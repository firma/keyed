  <line x1="800" y1="180" x2="800" y2="760" stroke="#D9D9D1" stroke-width="2"/>
  <line x1="120" y1="470" x2="1480" y2="470" stroke="#D9D9D1" stroke-width="2"/>
  <g transform="translate(150,220)">
    <text x="0" y="0" font-size="30" font-family="Arial, Helvetica, sans-serif" fill="#3B82F6" font-weight="700">Models</text>
    <text x="0" y="55" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Reasoning</text>
    <text x="0" y="95" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Multimodality</text>
    <text x="0" y="135" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Context</text>
    <text x="0" y="175" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Code generation</text>
  </g>
  <g transform="translate(900,220)">
    <text x="0" y="0" font-size="30" font-family="Arial, Helvetica, sans-serif" fill="#3B82F6" font-weight="700">Agents</text>
    <text x="0" y="55" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Planning</text>
    <text x="0" y="95" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Tool use</text>
    <text x="0" y="135" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Long-horizon tasks</text>
    <text x="0" y="175" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#111111">• Autonomous execution</text>
