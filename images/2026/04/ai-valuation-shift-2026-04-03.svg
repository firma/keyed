<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#07111d"/><stop offset="100%" stop-color="#10233f"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#67e8f9"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<circle cx="1320" cy="180" r="220" fill="#38bdf8" opacity="0.08"/>
<circle cx="260" cy="820" r="240" fill="#8b5cf6" opacity="0.08"/>
<text x="110" y="130" fill="#eef6ff" font-size="56" font-family="Arial, Helvetica, sans-serif" font-weight="700">金融市场如何重新给 AI 行业定价？</text>
<text x="110" y="182" fill="#a9bfd5" font-size="28" font-family="Arial, Helvetica, sans-serif">Model Narrative → Platform Entry → Cash Flow → System Control</text>
<rect x="150" y="320" width="280" height="180" rx="26" fill="#0d1727" stroke="#67e8f9" stroke-opacity="0.35"/>
<text x="188" y="392" fill="#67e8f9" font-size="32" font-family="Arial, Helvetica, sans-serif">1. Model</text>
<text x="188" y="434" fill="#dbe8f4" font-size="24" font-family="Arial, Helvetica, sans-serif">Narrative</text>
<text x="188" y="474" fill="#dbe8f4" font-size="22" font-family="Arial, Helvetica, sans-serif">参数、Benchmark、AGI 预期</text>
<rect x="500" y="320" width="280" height="180" rx="26" fill="#0d1727" stroke="#67e8f9" stroke-opacity="0.35"/>
<text x="538" y="392" fill="#67e8f9" font-size="32" font-family="Arial, Helvetica, sans-serif">2. Platform</text>
<text x="538" y="434" fill="#dbe8f4" font-size="24" font-family="Arial, Helvetica, sans-serif">Entry</text>
<text x="538" y="474" fill="#dbe8f4" font-size="22" font-family="Arial, Helvetica, sans-serif">谁控制入口与分发关系</text>
<rect x="850" y="320" width="280" height="180" rx="26" fill="#0d1727" stroke="#67e8f9" stroke-opacity="0.35"/>
<text x="888" y="392" fill="#67e8f9" font-size="32" font-family="Arial, Helvetica, sans-serif">3. Cash Flow</text>
<text x="888" y="434" fill="#dbe8f4" font-size="24" font-family="Arial, Helvetica, sans-serif">Quality</text>
<text x="888" y="474" fill="#dbe8f4" font-size="22" font-family="Arial, Helvetica, sans-serif">付费意愿、留存、利润路径</text>
<rect x="1200" y="320" width="280" height="180" rx="26" fill="#0d1727" stroke="#67e8f9" stroke-opacity="0.35"/>
<text x="1238" y="392" fill="#67e8f9" font-size="32" font-family="Arial, Helvetica, sans-serif">4. System</text>
<text x="1238" y="434" fill="#dbe8f4" font-size="24" font-family="Arial, Helvetica, sans-serif">Control</text>
<text x="1238" y="474" fill="#dbe8f4" font-size="22" font-family="Arial, Helvetica, sans-serif">运行时、权限、治理能力</text>
<line x1="430" y1="410" x2="500" y2="410" stroke="url(#accent)" stroke-width="6"/>
<line x1="780" y1="410" x2="850" y2="410" stroke="url(#accent)" stroke-width="6"/>
<line x1="1130" y1="410" x2="1200" y2="410" stroke="url(#accent)" stroke-width="6"/>
<rect x="150" y="620" width="1330" height="220" rx="30" fill="#0b1626" stroke="#8b5cf6" stroke-opacity="0.25"/>
<text x="190" y="700" fill="#f4f8ff" font-size="38" font-family="Arial, Helvetica, sans-serif" font-weight="700">定价逻辑迁移：从“更强模型”到“更强控制力”</text>
<text x="190" y="760" fill="#d7e6f2" font-size="28" font-family="Arial, Helvetica, sans-serif">• 早期：资本主要为技术想象力与模型上限支付溢价</text>
<text x="190" y="808" fill="#d7e6f2" font-size="28" font-family="Arial, Helvetica, sans-serif">• 当前：资本开始更看重入口、收入质量、成本结构与系统控制权</text>
<text x="190" y="856" fill="#d7e6f2" font-size="28" font-family="Arial, Helvetica, sans-serif">• 结果：AI 行业金融逻辑，正从概念交易转向结构交易</text>
</svg>
