<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#F7F7F3"/>
  <text x="800" y="86" text-anchor="middle" font-size="38" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">Acquiring Is Not a Windfall Business</text>
  <text x="800" y="126" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#666666">A low-margin, scale-driven, compliance-heavy industrial business with a narrowing opportunity window</text>
  <rect x="130" y="210" width="380" height="260" rx="20" fill="#FFFFFF" stroke="#D9D9D1"/>
  <rect x="610" y="210" width="380" height="260" rx="20" fill="#EEF5FF" stroke="#D9D9D1"/>
  <rect x="1090" y="210" width="380" height="260" rx="20" fill="#FFF8E8" stroke="#D9D9D1"/>
  <text x="320" y="275" text-anchor="middle" font-size="28" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">Industry Reality</text>
  <text x="320" y="325" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">Low gross margin</text>
  <text x="320" y="360" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">High fixed cost</text>
  <text x="320" y="395" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">Continuous risk burden</text>
  <text x="800" y="275" text-anchor="middle" font-size="28" font-family="Arial, Helvetica, sans-serif" fill="#3B82F6" font-weight="700">Why Leaders Win</text>
  <text x="800" y="325" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">Scale improves unit economics</text>
  <text x="800" y="360" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">Better bargaining power</text>
  <text x="800" y="395" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">Software + payment stack</text>
  <text x="1280" y="275" text-anchor="middle" font-size="28" font-family="Arial, Helvetica, sans-serif" fill="#B68B2D" font-weight="700">Why Mid-Tier Struggles</text>
  <text x="1280" y="325" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">Price pressure</text>
  <text x="1280" y="360" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">Compliance cost</text>
  <text x="1280" y="395" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">Shrinking entry window</text>
  <rect x="190" y="760" width="1220" height="56" rx="12" fill="#111111"/>
  <text x="800" y="796" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#F7F7F3">The leaders earn more than outsiders think, but the middle tier survives with more difficulty than outsiders imagine.</text>
</svg>