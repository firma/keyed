<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#1B2240"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#45D0FF"/>
      <stop offset="100%" stop-color="#9A6BFF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="86" text-anchor="middle" font-size="42" font-family="Arial, Helvetica, sans-serif" fill="#F8FAFF" font-weight="700">Multi-Cloud Distribution Becomes the New Control Layer</text>
  <text x="800" y="128" text-anchor="middle" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#B8C4E8">Frontier models may multi-home, but enterprise control consolidates around governance, billing, isolation, auditability, and workflow access.</text>
  <circle cx="800" cy="455" r="118" fill="#F8FAFF"/>
  <circle cx="800" cy="455" r="96" fill="#111827"/>
  <text x="800" y="443" text-anchor="middle" font-size="29" font-family="Arial, Helvetica, sans-serif" fill="#FFFFFF" font-weight="700">Control</text>
  <text x="800" y="480" text-anchor="middle" font-size="29" font-family="Arial, Helvetica, sans-serif" fill="#FFFFFF" font-weight="700">Layer</text>
  <path d="M220 650 C 390 575, 505 525, 690 465" stroke="url(#flow)" stroke-width="18" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M1380 650 C 1210 575, 1095 525, 910 465" stroke="url(#flow)" stroke-width="18" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M305 235 C 470 300, 580 360, 710 425" stroke="url(#flow)" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M1295 235 C 1130 300, 1020 360, 890 425" stroke="url(#flow)" stroke-width="14" fill="none" stroke-linecap="round"/>
  <g>
    <circle cx="220" cy="680" r="70" fill="#111827" stroke="#45D0FF" stroke-width="3"/>
    <text x="220" y="673" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#EAFBFF" font-weight="700">AWS</text>
    <text x="220" y="704" text-anchor="middle" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#9FDDF0">Bedrock control</text>
  </g>
  <g>
    <circle cx="1380" cy="680" r="70" fill="#111827" stroke="#9A6BFF" stroke-width="3"/>
    <text x="1380" y="673" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#F3ECFF" font-weight="700">Azure</text>
    <text x="1380" y="704" text-anchor="middle" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#D2C1FF">OpenAI first lane</text>
  </g>
  <g>
    <circle cx="310" cy="210" r="62" fill="#111827" stroke="#5EEAD4" stroke-width="3"/>
    <text x="310" y="202" text-anchor="middle" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#E8FFF8" font-weight="700">Google</text>
    <text x="310" y="230" text-anchor="middle" font-size="14" font-family="Arial, Helvetica, sans-serif" fill="#A3E9DB">default surfaces</text>
  </g>
  <g>
    <circle cx="1290" cy="210" r="62" fill="#111827" stroke="#F59E0B" stroke-width="3"/>
    <text x="1290" y="202" text-anchor="middle" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#FFF6E7" font-weight="700">Baidu</text>
    <text x="1290" y="230" text-anchor="middle" font-size="14" font-family="Arial, Helvetica, sans-serif" fill="#FFD38A">agentic training</text>
  </g>
  <g>
    <rect x="655" y="695" width="290" height="78" rx="20" fill="#FFFFFF" opacity="0.96"/>
    <text x="800" y="728" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#111827" font-weight="700">Governance • Billing</text>
    <text x="800" y="756" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111827">Isolation • Audit • Workflow</text>
  </g>
  <text x="800" y="834" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#F8FAFF">The new moat is not only the model, but the enterprise surface where the model is actually consumed and controlled.</text>
</svg>