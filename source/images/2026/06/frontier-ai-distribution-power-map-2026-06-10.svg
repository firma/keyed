<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8EE"/>
      <stop offset="100%" stop-color="#EEF5FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#101828" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <text x="800" y="88" text-anchor="middle" font-size="42" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">Frontier AI Distribution Power Map</text>
  <text x="800" y="130" text-anchor="middle" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#606778">As models become portable across clouds and ecosystems, power moves toward whoever owns the enterprise access, controls, and execution surface.</text>
  <rect x="250" y="220" width="1100" height="470" rx="34" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="330" y="285" width="250" height="110" rx="24" fill="#EAF8FF"/>
  <text x="455" y="330" text-anchor="middle" font-size="28" font-family="Arial, Helvetica, sans-serif" fill="#1772D0" font-weight="700">Model Layer</text>
  <text x="455" y="363" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#2D3547">OpenAI / Gemini / ERNIE / Qwen</text>
  <rect x="675" y="285" width="250" height="110" rx="24" fill="#F4EEFF"/>
  <text x="800" y="330" text-anchor="middle" font-size="28" font-family="Arial, Helvetica, sans-serif" fill="#6F46E8" font-weight="700">Control Layer</text>
  <text x="800" y="363" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#2D3547">IAM / VPC / KMS / Audit / Billing</text>
  <rect x="1020" y="285" width="250" height="110" rx="24" fill="#FFF3E6"/>
  <text x="1145" y="330" text-anchor="middle" font-size="28" font-family="Arial, Helvetica, sans-serif" fill="#C26A14" font-weight="700">Work Surface</text>
  <text x="1145" y="363" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#2D3547">Cloud / Devices / Workflow / Enterprise</text>
  <circle cx="800" cy="525" r="108" fill="#111827"/>
  <text x="800" y="510" text-anchor="middle" font-size="30" font-family="Arial, Helvetica, sans-serif" fill="#FFFFFF" font-weight="700">New</text>
  <text x="800" y="548" text-anchor="middle" font-size="30" font-family="Arial, Helvetica, sans-serif" fill="#FFFFFF" font-weight="700">Distribution Moat</text>
  <path d="M580 340 L 690 340" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
  <path d="M925 340 L 1020 340" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
  <path d="M800 395 L 800 417" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
  <rect x="365" y="610" width="280" height="92" rx="24" fill="#ECFBF4"/>
  <text x="505" y="650" text-anchor="middle" font-size="26" font-family="Arial, Helvetica, sans-serif" fill="#17845A" font-weight="700">US cluster</text>
  <text x="505" y="682" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#2D3547">Microsoft / AWS / Google</text>
  <rect x="955" y="610" width="280" height="92" rx="24" fill="#FFF2F2"/>
  <text x="1095" y="650" text-anchor="middle" font-size="26" font-family="Arial, Helvetica, sans-serif" fill="#B63A3A" font-weight="700">China cluster</text>
  <text x="1095" y="682" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#2D3547">Baidu / Alibaba</text>
  <text x="800" y="812" text-anchor="middle" font-size="23" font-family="Arial, Helvetica, sans-serif" fill="#111111">The contest is shifting from who trains the best model to who controls where the model is accessed, governed, and embedded into real work.</text>
</svg>