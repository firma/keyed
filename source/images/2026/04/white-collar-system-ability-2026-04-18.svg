<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#F7F7F3"/>
  <text x="800" y="86" text-anchor="middle" font-size="38" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">The Most Dangerous Job Is Not Programmer, but White-Collar Without System Ability</text>
  <text x="800" y="126" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#666666">AI is compressing middle-layer information work faster than many people expect</text>
  <rect x="170" y="220" width="520" height="390" rx="22" fill="#FFFFFF" stroke="#D9D9D1"/>
  <rect x="910" y="220" width="520" height="390" rx="22" fill="#EEF5FF" stroke="#D9D9D1"/>
  <text x="430" y="285" text-anchor="middle" font-size="30" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">System Attached</text>
  <text x="430" y="335" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">• formatting</text>
  <text x="430" y="370" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">• relaying information</text>
  <text x="430" y="405" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">• meeting follow-up</text>
  <text x="430" y="440" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">• document packaging</text>
  <text x="430" y="475" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">• process patching</text>
  <text x="1170" y="285" text-anchor="middle" font-size="30" font-family="Arial, Helvetica, sans-serif" fill="#3B82F6" font-weight="700">System Builder</text>
  <text x="1170" y="335" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">• defining problems</text>
  <text x="1170" y="370" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">• designing workflows</text>
  <text x="1170" y="405" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">• assigning humans + AI</text>
  <text x="1170" y="440" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">• making decisions</text>
  <text x="1170" y="475" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">• owning outcomes</text>
  <line x1="740" y1="415" x2="860" y2="415" stroke="#111111" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="800" y="390" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">Career pressure</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#111111"/>
    </marker>
  </defs>
  <rect x="170" y="770" width="1260" height="56" rx="12" fill="#111111"/>
  <text x="800" y="806" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#F7F7F3">The real divide is no longer white-collar vs blue-collar. It is system builder vs system patch.</text>
</svg>