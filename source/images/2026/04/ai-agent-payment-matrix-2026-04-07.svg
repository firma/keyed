<svg width="1600" height="960" viewBox="0 0 1600 960" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111d"/>
      <stop offset="100%" stop-color="#101f31"/>
    </linearGradient>
    <style>
      .title { font: 700 50px 'Inter', 'Segoe UI', sans-serif; fill: #f5fbff; }
      .sub { font: 400 24px 'Inter', 'Segoe UI', sans-serif; fill: #a7bbcf; }
      .head { font: 700 24px 'Inter', 'Segoe UI', sans-serif; fill: #ffffff; }
      .cell { font: 400 21px 'Inter', 'Segoe UI', sans-serif; fill: #d7e4f2; }
      .label { font: 700 22px 'Inter', 'Segoe UI', sans-serif; fill: #8db8ff; }
    </style>
  </defs>
  <rect width="1600" height="960" fill="url(#bg)"/>
  <text x="110" y="110" class="title">Agent Payment Protocol Matrix</text>
  <text x="110" y="150" class="sub">四个方向分别在抢什么：商业支付、机器支付、协作交易与支付接入</text>

  <rect x="110" y="220" width="1380" height="90" rx="16" fill="#17304c"/>
  <rect x="110" y="310" width="1380" height="120" rx="16" fill="#10253d"/>
  <rect x="110" y="440" width="1380" height="120" rx="16" fill="#10253d"/>
  <rect x="110" y="570" width="1380" height="120" rx="16" fill="#10253d"/>
  <rect x="110" y="700" width="1380" height="120" rx="16" fill="#10253d"/>

  <text x="160" y="275" class="head">Protocol</text>
  <text x="470" y="275" class="head">Primary role</text>
  <text x="860" y="275" class="head">Best-fit scenario</text>
  <text x="1240" y="275" class="head">What it is really fighting for</text>

  <text x="160" y="382" class="label">AP2</text>
  <text x="470" y="382" class="cell">Agent commerce authorization layer</text>
  <text x="860" y="382" class="cell">用户授权 agent 购物、下单、支付</text>
  <text x="1240" y="382" class="cell">定义 agent 商业支付的信任与责任结构</text>

  <text x="160" y="512" class="label">x402</text>
  <text x="470" y="512" class="cell">Machine-native payment rail</text>
  <text x="860" y="512" class="cell">API、数据、算力、服务的即时付费</text>
  <text x="1240" y="512" class="cell">定义机器社会里的默认付款语言</text>

  <text x="160" y="642" class="label">A2A + x402</text>
  <text x="470" y="642" class="cell">Agent-to-agent transaction protocol</text>
  <text x="860" y="642" class="cell">收费型 agent 协作与任务执行</text>
  <text x="1240" y="642" class="cell">把通信协议升级为交易协议</text>

  <text x="160" y="772" class="label">MCP payment</text>
  <text x="470" y="772" class="cell">Tool access / execution layer</text>
  <text x="860" y="772" class="cell">让 Claude / Cursor 等直接调支付能力</text>
  <text x="1240" y="772" class="cell">抢占 agent 支付接入面的默认工具接口</text>
</svg>