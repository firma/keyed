  <rect x="150" y="804" width="1300" height="54" rx="12" fill="#111111"/>
  <text x="800" y="839" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#F7F7F3">The greatest pressure falls on roles that move information, not on roles that design systems.</text>
