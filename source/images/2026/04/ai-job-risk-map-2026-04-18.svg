  <line x1="260" y1="720" x2="260" y2="180" stroke="#111111" stroke-width="4"/>
  <text x="815" y="775" text-anchor="middle" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#111111">System Ability →</text>
  <text x="120" y="450" text-anchor="middle" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#111111" transform="rotate(-90 120 450)">AI Risk ↑</text>
  <circle cx="420" cy="300" r="78" fill="#FDE68A" stroke="#D9D9D1"/>
