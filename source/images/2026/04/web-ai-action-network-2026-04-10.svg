<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#F7F7F3"/>
  <text x="800" y="88" text-anchor="middle" font-size="40" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">The Web Is Becoming an Action Network</text>
  <text x="800" y="128" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#666666">From content, to execution, to machine-native value exchange</text>
  <rect x="420" y="180" width="760" height="120" rx="18" fill="#EEF5FF" stroke="#D9D9D1"/>
  <text x="800" y="228" text-anchor="middle" font-size="34" font-family="Arial, Helvetica, sans-serif" fill="#3B82F6" font-weight="700">AI Layer</text>
  <text x="800" y="268" text-anchor="middle" font-size="21" font-family="Arial, Helvetica, sans-serif" fill="#111111">Intent · Planning · Agents · Execution</text>
  <rect x="300" y="360" width="1000" height="140" rx="18" fill="#FFFFFF" stroke="#D9D9D1"/>
  <text x="800" y="412" text-anchor="middle" font-size="34" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">Web Layer</text>
  <text x="800" y="452" text-anchor="middle" font-size="21" font-family="Arial, Helvetica, sans-serif" fill="#111111">Pages · APIs · SaaS · Browsers · Services</text>
  <rect x="360" y="570" width="880" height="140" rx="18" fill="#FFF8E8" stroke="#D9D9D1"/>
  <text x="800" y="622" text-anchor="middle" font-size="34" font-family="Arial, Helvetica, sans-serif" fill="#B68B2D" font-weight="700">Crypto / Web3 Layer</text>
  <text x="800" y="662" text-anchor="middle" font-size="21" font-family="Arial, Helvetica, sans-serif" fill="#111111">Payments · Identity · Authorization · Settlement · Digital assets</text>
  <text x="800" y="520" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">AI turns the web into an execution layer. Crypto turns it into a value layer.</text>
  <line x1="800" y1="300" x2="800" y2="360" stroke="#111111" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="800" y1="500" x2="800" y2="570" stroke="#111111" stroke-width="4" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#111111"/>
    </marker>
  </defs>
  <rect x="170" y="800" width="1260" height="56" rx="12" fill="#111111"/>
  <text x="800" y="836" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#F7F7F3">The next internet is not just readable. It is actionable and transactable.</text>
</svg>