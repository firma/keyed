<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#F7F7F3"/>
  <text x="800" y="86" text-anchor="middle" font-size="40" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">From Answer Machine to Outcome Machine</text>
  <text x="800" y="126" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#666666">The shift is not just what AI can say, but how far it can push work toward completion</text>
  <rect x="180" y="230" width="500" height="380" rx="22" fill="#FFFFFF" stroke="#D9D9D1"/>
  <rect x="920" y="230" width="500" height="380" rx="22" fill="#EEF5FF" stroke="#D9D9D1"/>
  <text x="430" y="300" text-anchor="middle" font-size="30" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">Answer / Draft Layer</text>
  <text x="430" y="360" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">summaries</text>
  <text x="430" y="395" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">rough copy</text>
  <text x="430" y="430" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">outlines</text>
  <text x="430" y="465" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">first ideas</text>
  <text x="1170" y="300" text-anchor="middle" font-size="30" font-family="Arial, Helvetica, sans-serif" fill="#3B82F6" font-weight="700">Outcome Layer</text>
  <text x="1170" y="360" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">slides</text>
  <text x="1170" y="395" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">one-pagers</text>
  <text x="1170" y="430" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">prototypes</text>
  <text x="1170" y="465" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">presentation-ready work</text>
  <line x1="700" y1="420" x2="900" y2="420" stroke="#111111" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="800" y="390" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">AI is moving into the most time-consuming layer of white-collar work</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#111111"/>
    </marker>
  </defs>
  <rect x="160" y="770" width="1280" height="56" rx="12" fill="#111111"/>
  <text x="800" y="806" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#F7F7F3">The real shift is not just better content generation, but compression of presentation labor.</text>
</svg>