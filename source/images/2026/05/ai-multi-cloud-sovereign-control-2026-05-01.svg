<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#F7F7F3"/>
  <text x="800" y="86" text-anchor="middle" font-size="38" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">AI Is Moving from Exclusive Platform Lock-In to Multi-Cloud Distribution</text>
  <text x="800" y="126" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#666666">Model power is separating from platform control, while sovereign deployment becomes the new bargaining layer</text>
  <rect x="180" y="220" width="500" height="340" rx="22" fill="#FFFFFF" stroke="#D9D9D1"/>
  <rect x="920" y="220" width="500" height="340" rx="22" fill="#EEF5FF" stroke="#D9D9D1"/>
  <text x="430" y="290" text-anchor="middle" font-size="30" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">Old Structure</text>
  <text x="430" y="350" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">Model company + cloud platform</text>
  <text x="430" y="385" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">tightly bundled</text>
  <text x="430" y="420" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">exclusive or semi-exclusive</text>
  <text x="430" y="455" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">distribution lock-in</text>
  <text x="1170" y="290" text-anchor="middle" font-size="30" font-family="Arial, Helvetica, sans-serif" fill="#3B82F6" font-weight="700">New Structure</text>
  <text x="1170" y="350" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">Models distributed across clouds</text>
  <text x="1170" y="385" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">platforms compete as execution layers</text>
  <text x="1170" y="420" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">sovereign deployment becomes control</text>
  <text x="1170" y="455" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#111111">customers demand runtime boundaries</text>
  <line x1="700" y1="390" x2="900" y2="390" stroke="#111111" stroke-width="5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#111111"/>
    </marker>
  </defs>
  <rect x="160" y="770" width="1280" height="56" rx="12" fill="#111111"/>
  <text x="800" y="806" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#F7F7F3">The next AI contest is no longer just over intelligence, but over where models can economically, legally, and operationally run.</text>
</svg>