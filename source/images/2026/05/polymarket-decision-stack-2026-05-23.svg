  <text x="800" y="702" text-anchor="middle" font-size="27" font-family="Arial, Helvetica, sans-serif" fill="#6E47E5" font-weight="700">Execution + Stoploss + Backtest</text>
  <path d="M800 295 L800 325" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
  <path d="M800 405 L800 435" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
  <path d="M800 513 L800 545" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
  <path d="M800 621 L800 650" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
  <text x="800" y="810" text-anchor="middle" font-size="23" font-family="Arial, Helvetica, sans-serif" fill="#111111">Real edge comes from turning signals into a disciplined system that filters, sizes, executes, and survives.</text>
