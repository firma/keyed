  <text x="800" y="375" text-anchor="middle" font-size="27" font-family="Arial, Helvetica, sans-serif" fill="#0B5FA5" font-weight="700">Pattern Intercept</text>
  <rect x="490" y="435" width="620" height="78" rx="22" fill="#E9FBEF"/>
  <text x="800" y="483" text-anchor="middle" font-size="27" font-family="Arial, Helvetica, sans-serif" fill="#16794A" font-weight="700">Confidence + Position Tier</text>
  <rect x="530" y="545" width="540" height="76" rx="22" fill="#FFF1DF"/>
