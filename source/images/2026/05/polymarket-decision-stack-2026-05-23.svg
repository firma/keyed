  <rect width="1600" height="900" fill="url(#bg2)"/>
  <text x="800" y="88" text-anchor="middle" font-size="42" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">The Polymarket Decision Stack</text>
  <text x="800" y="130" text-anchor="middle" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#5E6473">A viable trading system is a stacked filter, not a single prediction.</text>
