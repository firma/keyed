<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#F6F5F0"/>
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.09"/>
    </filter>
  </defs>
  <text x="800" y="82" text-anchor="middle" font-size="42" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">Google’s Agentic Traffic System</text>
  <text x="800" y="124" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#666666">Agentic AI becomes strategically different when it stops living in demos and starts living in the products people already use by default.</text>
  <rect x="250" y="205" width="1100" height="500" rx="32" fill="#FFFFFF" filter="url(#soft)"/>
  <rect x="330" y="280" width="260" height="120" rx="24" fill="#EEF3FF"/>
  <text x="460" y="330" text-anchor="middle" font-size="28" font-family="Arial, Helvetica, sans-serif" fill="#326BFF" font-weight="700">Search</text>
  <text x="460" y="365" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">2.5B AI Overviews MAU</text>
  <rect x="670" y="280" width="260" height="120" rx="24" fill="#F3EEFF"/>
  <text x="800" y="330" text-anchor="middle" font-size="28" font-family="Arial, Helvetica, sans-serif" fill="#7B61FF" font-weight="700">AI Mode</text>
  <text x="800" y="365" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">1B monthly active users</text>
  <rect x="1010" y="280" width="260" height="120" rx="24" fill="#FFF3E9"/>
  <text x="1140" y="330" text-anchor="middle" font-size="28" font-family="Arial, Helvetica, sans-serif" fill="#C67A2D" font-weight="700">Gemini App</text>
  <text x="1140" y="365" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">900M monthly active users</text>
  <circle cx="800" cy="525" r="105" fill="#111111"/>
  <text x="800" y="512" text-anchor="middle" font-size="28" font-family="Arial, Helvetica, sans-serif" fill="#F6F5F0" font-weight="700">Default</text>
  <text x="800" y="548" text-anchor="middle" font-size="28" font-family="Arial, Helvetica, sans-serif" fill="#F6F5F0" font-weight="700">Behavior Layer</text>
  <line x1="460" y1="400" x2="735" y2="480" stroke="#326BFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="800" y1="400" x2="800" y2="420" stroke="#7B61FF" stroke-width="5" stroke-linecap="round"/>
  <line x1="1140" y1="400" x2="865" y2="480" stroke="#C67A2D" stroke-width="5" stroke-linecap="round"/>
  <rect x="370" y="630" width="260" height="110" rx="24" fill="#F1F8EE"/>
  <text x="500" y="675" text-anchor="middle" font-size="26" font-family="Arial, Helvetica, sans-serif" fill="#3B8C4E" font-weight="700">Maps / YouTube</text>
  <text x="500" y="708" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">daily surfaces</text>
  <rect x="970" y="630" width="260" height="110" rx="24" fill="#F1F8EE"/>
  <text x="1100" y="675" text-anchor="middle" font-size="26" font-family="Arial, Helvetica, sans-serif" fill="#3B8C4E" font-weight="700">Cloud / APIs</text>
  <text x="1100" y="708" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#111111">scale industrialization</text>
  <rect x="160" y="785" width="1280" height="52" rx="14" fill="#111111"/>
  <text x="800" y="819" text-anchor="middle" font-size="23" font-family="Arial, Helvetica, sans-serif" fill="#F6F5F0">The strategic shift is not a better AI app alone, but an agentic layer flowing through existing mass consumer traffic lanes.</text>
</svg>