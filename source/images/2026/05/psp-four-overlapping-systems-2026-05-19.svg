<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#F7F7F3"/>
  <text x="800" y="86" text-anchor="middle" font-size="38" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">PSP Is No Longer One Role, but Four Overlapping Systems</text>
  <text x="800" y="126" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#666666">The real complexity in payments comes from the fact that one company often exists simultaneously in commercial, card-network, PCI, and regulatory systems.</text>
  <rect x="160" y="220" width="1280" height="420" rx="24" fill="#FFFFFF" stroke="#D9D9D1"/>
  <rect x="225" y="300" width="250" height="240" rx="20" fill="#EEF5FF" stroke="#D9D9D1"/>
  <text x="350" y="350" text-anchor="middle" font-size="26" font-family="Arial, Helvetica, sans-serif" fill="#3B82F6" font-weight="700">Commercial</text>
  <text x="350" y="390" text-anchor="middle" font-size="19" font-family="Arial, Helvetica, sans-serif" fill="#111111">PSP / LPSP</text>
  <text x="350" y="423" text-anchor="middle" font-size="19" font-family="Arial, Helvetica, sans-serif" fill="#111111">PayFac / MoR</text>
  <text x="350" y="456" text-anchor="middle" font-size="19" font-family="Arial, Helvetica, sans-serif" fill="#111111">Marketplace / ISO</text>
  <rect x="525" y="300" width="250" height="240" rx="20" fill="#FFF8E8" stroke="#D9D9D1"/>
  <text x="650" y="350" text-anchor="middle" font-size="26" font-family="Arial, Helvetica, sans-serif" fill="#B68B2D" font-weight="700">Card Network</text>
  <text x="650" y="390" text-anchor="middle" font-size="19" font-family="Arial, Helvetica, sans-serif" fill="#111111">PayFac / MSP</text>
  <text x="650" y="423" text-anchor="middle" font-size="19" font-family="Arial, Helvetica, sans-serif" fill="#111111">Marketplace / TR</text>
  <text x="650" y="456" text-anchor="middle" font-size="19" font-family="Arial, Helvetica, sans-serif" fill="#111111">Wallet roles</text>
  <rect x="825" y="300" width="250" height="240" rx="20" fill="#FFFFFF" stroke="#D9D9D1"/>
  <text x="950" y="350" text-anchor="middle" font-size="26" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">PCI DSS</text>
  <text x="950" y="390" text-anchor="middle" font-size="19" font-family="Arial, Helvetica, sans-serif" fill="#111111">TPSP</text>
  <text x="950" y="423" text-anchor="middle" font-size="19" font-family="Arial, Helvetica, sans-serif" fill="#111111">Nested TPSP</text>
  <text x="950" y="456" text-anchor="middle" font-size="19" font-family="Arial, Helvetica, sans-serif" fill="#111111">security scope</text>
  <rect x="1125" y="300" width="250" height="240" rx="20" fill="#FFFFFF" stroke="#D9D9D1"/>
  <text x="1250" y="350" text-anchor="middle" font-size="26" font-family="Arial, Helvetica, sans-serif" fill="#111111" font-weight="700">Regulatory</text>
  <text x="1250" y="390" text-anchor="middle" font-size="19" font-family="Arial, Helvetica, sans-serif" fill="#111111">MPI / SPI</text>
  <text x="1250" y="423" text-anchor="middle" font-size="19" font-family="Arial, Helvetica, sans-serif" fill="#111111">PISP / AISP</text>
  <text x="1250" y="456" text-anchor="middle" font-size="19" font-family="Arial, Helvetica, sans-serif" fill="#111111">licensing scope</text>
  <rect x="140" y="770" width="1320" height="56" rx="12" fill="#111111"/>
  <text x="800" y="806" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#F7F7F3">Payments become confusing when people ask one question. They become clear when you ask the same company four different structural questions.</text>
</svg>